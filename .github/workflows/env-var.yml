name: "Environment Variables"

on: 
    workflow_dispatch:
env:
    WORKFLOW_VAR: "Available across the workflow"

jobs:
    job-1:
        runs-on: ubuntu-24.04
        env:
            JOB_VAR: "Available across the Job"
        steps:
            - name: step-1
              env:
                STEP_VAR: "Only available in this step"
              run: |
                echo "WORKFLOW_VAR= $WORKFLOW_VAR"
                echo "JOB_VAR= $JOB_VAR"
                echo "STEP_VAR= $STEP_VAR"
            
            - name: step-2
              run: |
                echo "WORKFLOW_VAR= $WORKFLOW_VAR"
                echo "JOB_VAR= $JOB_VAR"
                echo "STEP_VAR= $STEP_VAR"
    
    job-2:
        runs-on: ubuntu-24.04
        steps:
            - name: step-1
              run: |
                echo "WORKFLOW_VAR= $WORKFLOW_VAR"
                echo "JOB_VAR= $JOB_VAR"
                echo "STEP_VAR= $STEP_VAR"