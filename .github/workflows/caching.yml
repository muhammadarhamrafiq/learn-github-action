name: "Caching"

on:
    workflow_dispatch:


jobs:
    actions-cache:
        runs-on: ubuntu-24.04
        steps:
            - name: Restore Cache
              id: demo-cache
              uses: actions/cache@v4
              with:
                path: demo-cache
                key: demo-cache-v1
            
            - name: Populate Cache Directory
              if: steps.demo-cache.outputs.hit != 'true'
              run: |
                echo "Cache miss - generating Content"
                mkdir demo-cache
                data > demo-cache/timestamp.txt
        
            - name: Save Cache
              if: steps.demo-cache.outputs.hit != 'true'
              uses: actions/cache@v4
              with:
                path: demo-cache
                key: demo-cache-v1
            
            - name: Verify Cache Status
              run: |
                echo "cache hit? -> ${{ steps.demo-cache.outputs.hit }}"
                cat demo-cache/timestamp.txt
            